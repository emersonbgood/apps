<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Slots - Auto Play</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .stats { font-size: 32px; color: #f1c40f; margin-bottom: 20px; }
        .machine { background: #444; padding: 20px; border-radius: 20px; border: 5px solid #d35400; text-align: center;}
        .reels { display: flex; gap: 10px; background: #000; padding: 15px; margin-bottom: 15px; }
        .reel { width: 60px; height: 80px; background: white; color: black; font-size: 40px; display: flex; align-items: center; justify-content: center; }
        button { width: 100%; padding: 12px; margin-top: 5px; font-weight: bold; border: none; cursor: pointer; }
        #spin-btn { background: #e74c3c; color: white; }
        #auto-btn { background: #34495e; color: white; }
        #auto-btn.active { background: #27ae60; }
    </style>
</head>
<body>
    <div class="stats">💰 Coins: <span id="balance">...</span></div>
    <div class="machine">
        <div class="reels">
            <div id="r1" class="reel">🍒</div><div id="r2" class="reel">🍒</div><div id="r3" class="reel">🍒</div>
        </div>
        <input type="number" id="bet-amount" value="100" style="width: 80%; margin-bottom: 10px; padding: 5px;">
        <button id="spin-btn">SPIN</button>
        <button id="auto-btn">AUTO PLAY: OFF</button>
    </div>

    <script>
        let balance = parseInt(localStorage.getItem('casinoBalance')) || 10000;
        let isAuto = false;
        const symbols = ['🍒', '🍋', '🔔', '💎'];
        function updateUI() { document.getElementById('balance').innerText = balance; localStorage.setItem('casinoBalance', balance); }
        updateUI();

        const spinBtn = document.getElementById('spin-btn');
        const autoBtn = document.getElementById('auto-btn');

        autoBtn.onclick = () => {
            isAuto = !isAuto;
            autoBtn.innerText = `AUTO PLAY: ${isAuto ? 'ON' : 'OFF'}`;
            autoBtn.classList.toggle('active', isAuto);
            if (isAuto && !spinBtn.disabled) spin();
        };

        function spin() {
            let bet = parseInt(document.getElementById('bet-amount').value);
            if (bet > balance) { isAuto = false; return alert("No coins!"); }
            balance -= bet; updateUI();
            spinBtn.disabled = true;

            let count = 0;
            const anim = setInterval(() => {
                document.getElementById('r1').innerText = symbols[Math.floor(Math.random()*4)];
                document.getElementById('r2').innerText = symbols[Math.floor(Math.random()*4)];
                document.getElementById('r3').innerText = symbols[Math.floor(Math.random()*4)];
                if (++count > 12) {
                    clearInterval(anim);
                    const s = [document.getElementById('r1').innerText, document.getElementById('r2').innerText, document.getElementById('r3').innerText];
                    if (s[0] === s[1] && s[1] === s[2]) balance += bet * 10;
                    else if (s[0] === s[1] || s[1] === s[2]) balance += Math.floor(bet * 1.5);
                    updateUI(); spinBtn.disabled = false;
                    if (isAuto) setTimeout(spin, 600);
                }
            }, 80);
        }
        spinBtn.onclick = spin;
    </script>
</body>
</html>
