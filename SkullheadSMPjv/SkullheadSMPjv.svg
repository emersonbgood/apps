<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org">
  <defs>
    <filter id="shade">
      <feColorMatrix type="matrix" values="0.7 0 0 0 0  0 0.7 0 0 0  0 0 0.7 0 0  0 0 0 1 0" />
    </filter>
  </defs>

  <style>
    image { image-rendering: pixelated; }
    .side { filter: url(#shade); }
  </style>

  <g transform="translate(500, 500)">
    <!-- TOP FACE -->
    <g transform="translate(0, -200) scale(1, 0.577) rotate(45) translate(-200, -200)">
      <image width="400" height="400" href="grass_top.png" />
    </g>

    <!-- LEFT FACE -->
    <g class="side" transform="translate(-173, 0) skewY(30) scale(0.866, 1) translate(-200, -200)">
       <image width="400" height="400" href="grass_side.png" />
    </g>

    <!-- RIGHT FACE -->
    <g class="side" transform="translate(173, 0) skewY(-30) scale(0.866, 1) translate(-200, -200)">
       <image width="400" height="400" href="grass_side.png" />
    </g>
  </g>
</svg>
