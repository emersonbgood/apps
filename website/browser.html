<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
        #toolbar { background: #333; padding: 5px; display: flex; align-items: center; color: white; gap: 5px; }
        #url-bar { flex-grow: 1; padding: 5px; border-radius: 4px; border: none; }
        button { cursor: pointer; padding: 5px 10px; background: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; }
        iframe { flex-grow: 1; border: none; width: 100%; }
    </style>
</head>
<body>
    <div id="toolbar">
        <button onclick="nav('back')">←</button>
        <button onclick="nav('forward')">→</button>
        <button onclick="nav('reload')">↻</button>
        <input id="url-bar" type="text" value="https://google.com">
        <button onclick="goToUrl()">Go</button>
    </div>
    <iframe id="browser-frame" src="https://emersonberry.github.io"></iframe>

    <script>
        const frame = document.getElementById('browser-frame');
        const input = document.getElementById('url-bar');

        function nav(type) {
            if (type === 'back') frame.contentWindow.history.back();
            if (type === 'forward') frame.contentWindow.history.forward();
            if (type === 'reload') frame.contentWindow.location.reload();
        }

        function goToUrl() {
            let url = input.value;
            if (!url.startsWith('http')) url = 'https://' + url;
            frame.src = url;
        }

        input.addEventListener('keypress', (e) => { if (e.key === 'Enter') goToUrl(); });
    </script>
</body>
</html>
